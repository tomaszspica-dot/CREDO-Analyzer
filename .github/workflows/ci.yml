name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Python syntax
        run: |
          python - <<'PY'
          from pathlib import Path

          for path in sorted(Path("app").glob("*.py")):
              compile(
                  path.read_text(encoding="utf-8"),
                  str(path),
                  "exec",
              )
              print("PASS:", path)
          PY

      - name: JavaScript syntax
        run: |
          node --check app/app.js
          node --check app/features.js
          node --check app/timelapse.js

      - name: Shell syntax
        run: |
          bash -n start-credo.command
          bash -n stop-credo.command
          bash -n status-credo.command
          bash -n tools/public-preflight.sh
          bash -n tools/verify-provenance.sh

      - name: Verify upstream provenance
        run: |
          ./tools/verify-provenance.sh

      - name: Public preflight
        run: |
          ./tools/public-preflight.sh
